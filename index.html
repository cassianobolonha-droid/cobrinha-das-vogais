<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;background:#fdf3d8;font-family:'Fredoka',sans-serif;max-width:100vw}
#app{height:100%;height:100dvh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
header{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;padding:6px 12px;gap:8px}
#alvo{background:#fff;border:3px solid #f0e2b0;border-radius:18px;padding:3px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
#alvoTxt{font-size:15px;color:#6b5b2a;font-weight:600}
#alvoLetra{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;color:#fff;border:3px solid #f2b418;box-shadow:0 2px 0 rgba(0,0,0,.12);animation:pulsaAlvo 1s infinite alternate}
@keyframes pulsaAlvo{from{transform:scale(1)}to{transform:scale(1.08)}}
.btnTopo{font-size:24px;background:#fff;border:3px solid #f2b418;border-radius:14px;padding:5px 9px;cursor:pointer;touch-action:manipulation}
#estrelas{font-size:16px;letter-spacing:2px;min-height:20px;text-align:center;width:100%;max-width:480px}
#areaJogo{position:relative;flex:1;display:flex;align-items:center;justify-content:center;width:100%}
canvas{display:block;background:#fffdf3;border-radius:14px;border:4px solid #e7d9a8;box-shadow:0 4px 0 rgba(0,0,0,.06);margin:0 auto}
#balaoMsg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:#fff;border:4px solid #3fae5a;color:#2c7a3f;font-size:26px;font-weight:700;padding:8px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:5}
#balaoMsg.mostrar{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
#confete{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.pedacinho{position:absolute;width:10px;height:14px;top:-16px;border-radius:3px;animation:cai 1.4s linear forwards}
@keyframes cai{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
#dpad{width:100%;max-width:480px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:6px;padding:6px 16px calc(10px + env(safe-area-inset-bottom))}
.seta{font-size:22px;padding:8px 0;background:#fff;border:3px solid #3fae5a;color:#2c7a3f;border-radius:14px;cursor:pointer;box-shadow:0 3px 0 #2c7a3f;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.seta:active{transform:translateY(2px);box-shadow:0 1px 0 #2c7a3f}
#sUp{grid-column:2;grid-row:1}#sLeft{grid-column:1;grid-row:2}#sDown{grid-column:2;grid-row:2}#sRight{grid-column:3;grid-row:2}
/* ===== CORREÇÃO SAMSUNG: menus que centralizam quando cabem
   e ROLAM quando não cabem — nada mais corta nas pontas ===== */
.overlay{position:fixed;inset:0;background:#fdf3d8;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;text-align:center;padding:20px;z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay > *{flex-shrink:0}
.overlay > :first-child{margin-top:auto}
.overlay > :last-child{margin-bottom:auto}
.overlay.escondido{display:none}
.overlay h1{font-size:28px;color:#2c7a3f}
.overlay p{font-size:18px;color:#6b5b2a}
.overlay button{font-family:inherit;font-size:22px;font-weight:600;padding:12px 28px;border-radius:18px;border:none;cursor:pointer;background:#3fae5a;color:#fff;box-shadow:0 5px 0 #2c7a3f;touch-action:manipulation}
.overlay button:active{transform:translateY(3px);box-shadow:0 2px 0 #c2542a}
.faseBtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:min(92vw,420px);min-height:0;padding:12px 20px;font-size:23px}
.faseBtn small{font-size:14px;font-weight:500;opacity:.85}
.faseBtn.azul{background:#2f86eb;box-shadow:0 5px 0 #1c5fa8}
.faseBtn.azul:active{box-shadow:0 2px 0 #1c5fa8}
.faseBtn.roxo{background:#8e44ad;box-shadow:0 5px 0 #5e2f78}
.faseBtn.roxo:active{box-shadow:0 2px 0 #5e2f78}
.faseBtn.bloqueado{opacity:.45;pointer-events:none}
.tituloLinha{display:flex;align-items:center;justify-content:center;gap:8px}
.letrasLinha{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.miniLetra{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;border:2px solid rgba(0,0,0,.25);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.miniLetra.mini{width:22px;height:22px;font-size:12px;border-width:1px;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.miniLetra.grande{width:44px;height:44px;font-size:24px}
.voltar{background:transparent !important;color:#6b5b2a !important;box-shadow:none !important;font-size:17px !important;padding:6px 14px !important}
#btnProxima{background:#2f86eb;box-shadow:0 5px 0 #1c5fa8}
#btnProxima:active{box-shadow:0 2px 0 #1c5fa8}
#btnCopiar{background:#fff;color:#6b5b2a;box-shadow:0 5px 0 #d8c58a}
#btnNativo{background:#f2b418;color:#6b4b00;box-shadow:0 5px 0 #b98a0a}
#btnCaca{background:#f2b418;color:#6b4b00;box-shadow:0 5px 0 #b98a0a}
#btnMenu2{background:#fff;color:#6b5b2a;box-shadow:0 5px 0 #d8c58a}
#btnNome{background:#8e44ad;box-shadow:0 5px 0 #5e2f78}
#btnNome:active{box-shadow:0 2px 0 #5e2f78}
#inputNome{font-family:inherit;font-size:26px;font-weight:600;color:#2c7a3f;text-align:center;text-transform:uppercase;padding:10px 16px;border:3px solid #f2b418;border-radius:16px;background:#fff;width:min(80vw,320px);outline:none}
#medalha{font-size:72px;animation:pulsa 1s infinite alternate}
@keyframes pulsa{from{transform:scale(1)}to{transform:scale(1.15)}}
.versao{font-size:12px;color:#c4b268;margin-top:2px}
</style>
</head>
<body>

  <header>

      <span class="miniLetra" style="background:#c0392b">T</span>

</div>
<div id="pedirNome" class="overlay escondido">
  <h1>🔤 Qual é o seu nome?</h1>

  <input id="inputNome" maxlength="12" autocomplete="off" placeholder="DIGITE AQUI">
  <button class="faseBtn" onclick="confirmarNome()">🐍 Começar!</button>
  <button class="voltar" onclick="fecharNome()">← Voltar</button>
</div>
<div id="painelShare" class="overlay escondido">

  <button class="faseBtn" onclick="compartilharWhatsApp()">💬 Enviar no WhatsApp</button>
  <button class="faseBtn" id="btnCopiar" onclick="copiarLink()">📋 Copiar o link</button>

<script>
/* =========================================================
   COBRINHA DO ALFABETO — alfabetização (4-5 anos)
   Fase 1: Vogais (A→E→I→O→U)
   Fase 2: Consoantes em 4 blocos alfabéticos:
     B1: B C D F G · B2: H J K L M
     B3: N P Q R S · B4: T V W X Y Z
   Fase 3: Alfabeto completo A→Z, uma letra de
   cada vez — liberada após concluir o Bloco 4.
   Menus com bolinhas coloridas em todas as fases
   (Fase 3 com 26 bolinhas compactas em 2 fileiras).
   Modo "Meu nome": a cobrinha caça as letras do nome.
   Cobra nasce com 2 blocos; letras comidas grudam no
   corpo na ordem; esbarrar não corta nada. Sem morte,
   sem coleta de dados, progresso salvo no aparelho.
   CORREÇÕES (layout e cores originais preservados):
   1. Menus centralizam quando cabem e ROLAM quando
      não cabem — fim do corte do Y/Z e do rodapé.
   2. Botões de fase sem altura mínima fixa — o card
      cresce conforme as letras.
   3. Motor de voz robusto (espera entre falas,
      destrava motor pausado, tenta de novo sozinho).
   ========================================================= */
const COLS = 10, ROWS = 12;
const TICK = 420;
const GRUPOS = [
  { id:'vogais', bloco:0, letras:[
    {l:'A', cor:'#e74c3c', fala:'a'},
    {l:'E', cor:'#2f86eb', fala:'é'},
    {l:'I', cor:'#f0b429', fala:'i'},
    {l:'O', cor:'#e8752a', fala:'ó'},
    {l:'U', cor:'#8e44ad', fala:'u'}
  ]},
  { id:'b1', bloco:1, letras:[
    {l:'B', cor:'#27ae60', fala:'B de BOLA'},
    {l:'C', cor:'#c0392b', fala:'C de CASA'},
    {l:'D', cor:'#2f86eb', fala:'D de DADO'},
    {l:'F', cor:'#16a085', fala:'F de FACA'},
    {l:'G', cor:'#8e44ad', fala:'G de GATO'}
  ]},
  { id:'b2', bloco:2, letras:[
    {l:'H', cor:'#e67e22', fala:'H de HOJE'},
    {l:'J', cor:'#f39c12', fala:'J de JACARÉ'},
    {l:'K', cor:'#2980b9', fala:'K de KOALA'},
    {l:'L', cor:'#8e44ad', fala:'L de LEÃO'},
    {l:'M', cor:'#16a085', fala:'M de MACACO'}
  ]},
  { id:'b3', bloco:3, letras:[
    {l:'N', cor:'#e67e22', fala:'N de NAVIO'},
    {l:'P', cor:'#d35400', fala:'P de PATO'},
    {l:'Q', cor:'#8e44ad', fala:'Q de QUEIJO'},
    {l:'R', cor:'#e74c3c', fala:'R de RATO'},
    {l:'S', cor:'#2980b9', fala:'S de SAPO'}
  ]},
  { id:'b4', bloco:4, letras:[
    {l:'T', cor:'#c0392b', fala:'T de TATU'},
    {l:'V', cor:'#16a085', fala:'V de VACA'},
    {l:'W', cor:'#e67e22', fala:'W de WIFI'},
    {l:'X', cor:'#e74c3c', fala:'X de XÍCARA'},
    {l:'Y', cor:'#c0392b', fala:'Y de YAK'},
    {l:'Z', cor:'#16a085', fala:'Z de ZEBRA'}
  ]},
  { id:'alfabeto', bloco:5, letras:[
    {l:'A', cor:'#e74c3c', fala:'a'},
    {l:'B', cor:'#27ae60', fala:'bê'},
    {l:'C', cor:'#c0392b', fala:'cê'},
    {l:'D', cor:'#2f86eb', fala:'dê'},
    {l:'E', cor:'#2f86eb', fala:'é'},
    {l:'F', cor:'#16a085', fala:'éfe'},
    {l:'G', cor:'#8e44ad', fala:'gê'},
    {l:'H', cor:'#e67e22', fala:'agá'},
    {l:'I', cor:'#f0b429', fala:'i'},
    {l:'J', cor:'#f39c12', fala:'jota'},
    {l:'K', cor:'#2980b9', fala:'cá'},
    {l:'L', cor:'#8e44ad', fala:'éle'},
    {l:'M', cor:'#16a085', fala:'eme'},
    {l:'N', cor:'#e67e22', fala:'ene'},
    {l:'O', cor:'#e8752a', fala:'ó'},
    {l:'P', cor:'#d35400', fala:'pê'},
    {l:'Q', cor:'#8e44ad', fala:'quê'},
    {l:'R', cor:'#e74c3c', fala:'erre'},
    {l:'S', cor:'#2980b9', fala:'esse'},
    {l:'T', cor:'#c0392b', fala:'tê'},
    {l:'U', cor:'#8e44ad', fala:'u'},
    {l:'V', cor:'#16a085', fala:'vê'},
    {l:'W', cor:'#e67e22', fala:'dáblio'},
    {l:'X', cor:'#e74c3c', fala:'chis'},
    {l:'Y', cor:'#c0392b', fala:'ípsilon'},
    {l:'Z', cor:'#16a085', fala:'zê'}
  ]}
];
const PALETA_NOME = ['#e74c3c','#2f86eb','#f0b429','#e8752a','#8e44ad','#16a085','#d35400','#2980b9','#27ae60','#8e44ad','#e67e22','#c0392b'];
let cobra = [], dir = {x:1,y:0}, dirPendente = null;
let grupo = GRUPOS[0], alvoIdx = 0, comidas = 0, rodando = false, modo = 'facil';
let letras = [];
let letrasNaCobra = [];
let erroT = 0, cel = 30;
let crescerPendente = 0;
let grupoNome = null;
let festaTimer = null;
const $ = s => document.querySelector(s);
const tela = $('#tela'), ctx = tela.getContext('2d');
// ---- Progresso e nome salvos no aparelho ----
let prog = { vogais:false, blocos:[false,false,false,false], nome:false, alfabeto:false };
try{
  const s = localStorage.getItem('cobrinhaProgresso');
  if (s){
    const p = JSON.parse(s);
    if (p.blocos && p.blocos.length !== 4) p.blocos = [false,false,false,false];
    prog = Object.assign(prog, p);
  }
}catch(e){}
function salvarProg(){ try{ localStorage.setItem('cobrinhaProgresso', JSON.stringify(prog)); }catch(e){} }
function nomeSalvo(){ try{ return localStorage.getItem('cobrinhaNome') || ''; }catch(e){ return ''; } }
function salvarNome(n){ try{ localStorage.setItem('cobrinhaNome', n); }catch(e){} }
function alfabetoLiberado(){ return prog.blocos.every(b=>b); }
function renderMenus(){
  $('#medVog').textContent = prog.vogais ? '🏆' : '';
  $('#medConso').textContent = prog.blocos.every(b=>b) ? '🏆' : (prog.blocos.some(b=>b) ? '🟡' : '');
  $('#medFase3').textContent = prog.alfabeto ? '🏆' : (alfabetoLiberado() ? '' : '🔒');
  $('#medNome').textContent = prog.nome ? '🏆' : '';
  $('#medB1').textContent = prog.blocos[0] ? '🏆' : '';
  $('#medB2').textContent = prog.blocos[1] ? '🏆' : (prog.blocos[0] ? '' : '🔒');
  $('#medB3').textContent = prog.blocos[2] ? '🏆' : (prog.blocos[1] ? '' : '🔒');
  $('#medB4').textContent = prog.blocos[3] ? '🏆' : (prog.blocos[2] ? '' : '🔒');
  $('#btnB2').classList.toggle('bloqueado', !prog.blocos[0]);
  $('#btnB3').classList.toggle('bloqueado', !prog.blocos[1]);
  $('#btnB4').classList.toggle('bloqueado', !prog.blocos[2]);
  $('#btnFase3').classList.toggle('bloqueado', !alfabetoLiberado());
}
// 26 bolinhas compactas no botão da Fase 3 (2 fileiras de 13)
(function montarLinhaAlfabeto(){
  const linha = $('#linhaAlfabeto');
  GRUPOS[5].letras.forEach(v=>{
    const b = document.createElement('span');
    b.className = 'miniLetra mini';
    b.style.background = v.cor;
    b.textContent = v.l;
    linha.appendChild(b);
  });
})();
// ---- Voz em português (motor robusto) ----
let vozPT = null;
function acharVoz(){
  const vs = speechSynthesis.getVoices();
  const ptBR = vs.filter(v => /pt[-_]br/i.test(v.lang));
  const pt = vs.filter(v => /^pt/i.test(v.lang));
  vozPT = ptBR.find(v => /google/i.test(v.name))
       || pt.find(v => /google/i.test(v.name))
       || ptBR[0] || pt[0] || null;
}
if ('speechSynthesis' in window){ acharVoz(); speechSynthesis.onvoiceschanged = acharVoz; }
function falar(txt){
  if (!('speechSynthesis' in window)) return;
  const limpo = txt.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2B00}-\u{2BFF}]/gu,'').replace(/\s+/g,' ').trim();
  if (!limpo) return;
  function tentarFalar(segunda){
    if (!vozPT) acharVoz();
    let comecou = false;
    try{
      const u = new SpeechSynthesisUtterance(limpo);
      u.lang = 'pt-BR'; u.rate = .95; u.pitch = 1.1; u.volume = 1;
      if (vozPT) u.voice = vozPT;
      u.onstart = ()=>{ comecou = true; };
      speechSynthesis.speak(u);
    }catch(e){ return; }
    setTimeout(()=>{ try{ speechSynthesis.resume(); }catch(e){} }, 150);
    if (!segunda){
      setTimeout(()=>{
        if (!comecou){
          try{ speechSynthesis.cancel(); }catch(e){}
          setTimeout(()=>tentarFalar(true), 250);
        }
      }, 2000);
    }
  }
  let ocupado = false;
  try{ ocupado = speechSynthesis.speaking || speechSynthesis.pending; }catch(e){}
  if (ocupado){ try{ speechSynthesis.cancel(); }catch(e){} setTimeout(()=>tentarFalar(false), 180); }
  else tentarFalar(false);
}
function atual(){ return grupo.letras[alvoIdx]; }
function falarAlvo(){ falar('A cobrinha quer a letra ' + atual().fala + '!'); }
function anunciarAlvo(){
  const a = atual();
  $('#alvoLetra').textContent = a.l;
  $('#alvoLetra').style.background = a.cor;
  falarAlvo();
}
// ---- Sons ----
let audio = null;
function garantirAudio(){ if (!audio){ try{ audio = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function nota(freq, ini, dur, tipo, vol){
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = tipo || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || .2, audio.currentTime + ini);
  g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + ini + dur);
  o.connect(g); g.connect(audio.destination);
  o.start(audio.currentTime + ini); o.stop(audio.currentTime + ini + dur);
}
function somGlup(){ if(audio){ nota(523,0,.09,'triangle',.25); nota(784,.09,.14,'triangle',.25); } }
function somOps(){ if(audio) nota(196,0,.18,'sine',.18); }
function somFesta(){ if(audio) [523,659,784,1047].forEach((f,i)=>nota(f,i*.14,.22,'triangle',.22)); }
// ---- Confete e balão ----
function confete(qtd){
  const cores = ['#e74c3c','#2f86eb','#f0b429','#e8752a','#8e44ad','#3fae5a'];
  for (let i=0;i<(qtd||24);i++){
    const p = document.createElement('div');
    p.className = 'pedacinho';
    p.style.left = Math.random()*100 + '%';
    p.style.background = cores[i%cores.length];
    p.style.animationDuration = (1 + Math.random()*.8) + 's';
    p.style.animationDelay = (Math.random()*.3) + 's';
    $('#confete').appendChild(p);
    setTimeout(()=>p.remove(), 2500);
  }
}
let balaoTimer = null;
function balao(txt){
  const b = $('#balaoMsg');
  b.textContent = txt; b.classList.add('mostrar');
  clearTimeout(balaoTimer);
  balaoTimer = setTimeout(()=>b.classList.remove('mostrar'), 1200);
}
function pintarEstrelas(){
  const n = Math.min(comidas, 10);
  $('#estrelas').textContent = '⭐'.repeat(n) + (comidas>10 ? ' x'+comidas : '');
}
// ---- Tabuleiro ----
function celulaLivre(l){
  while (true){
    const x = Math.floor(Math.random()*COLS), y = Math.floor(Math.random()*ROWS);
    const naCobra = cobra.some(s => s.x===x && s.y===y);
    const naLetra = letras.some(t => t.x===x && t.y===y);
    const perto = Math.abs(cobra[0].x-x) + Math.abs(cobra[0].y-y) < 3;
    if (!naCobra && !naLetra && !perto) return {x, y, l:l.l, cor:l.cor};
  }
}
function colocarLetras(){
  letras = [];
  if (modo === 'facil') letras.push(celulaLivre(atual()));
  else grupo.letras.forEach(v => letras.push(celulaLivre(v)));
}
// ---- Cobra (nasce com 2 blocos) ----
function novaCobra(){
  for (let y=2; y<ROWS-2; y++){
    for (let x=1; x<COLS-2; x++){
      const livre = !letras.some(t => (t.x===x || t.x===x+1) && t.y===y);
      if (livre){ cobra=[{x:x+1,y},{x,y}]; dir={x:1,y:0}; dirPendente=null; return; }
    }
  }
  cobra=[{x:5,y:6},{x:4,y:6}]; dir={x:1,y:0}; dirPendente=null;
}
// ---- Resgate: se enrolar de vez, reencaixa sem perder letras ----
function reorganizar(){
  const n = cobra.length;
  for (let y=0; y<ROWS; y++){
    for (let x=0; x+n<=COLS; x++){
      if (letras.every(t => t.y!==y || t.x<x || t.x>=x+n)){
        dir={x:1,y:0}; dirPendente=null;
        cobra = cobra.map((_,i)=>({x:x+n-1-i, y}));
        balao('A cobrinha se reorganizou! 🐍');
        return;
      }
    }
  }
  for (let x=0; x<COLS; x++){
    for (let y=0; y+n<=ROWS; y++){
      if (letras.every(t => t.x!==x || t.y<y || t.y>=y+n)){
        dir={x:0,y:1}; dirPendente=null;
        cobra = cobra.map((_,i)=>({x, y:y+n-1-i}));
        balao('A cobrinha se reorganizou! 🐍');
        return;
      }
    }
  }
}
// ---- Passo da cobra (esbarrar não corta nada) ----
function passo(){
  if (dirPendente){
    const reverso = dirPendente.x === -dir.x && dirPendente.y === -dir.y;
    if (!reverso) dir = dirPendente;
    dirPendente = null;
  }
  const nx = (cobra[0].x + dir.x + COLS) % COLS;
  const ny = (cobra[0].y + dir.y + ROWS) % ROWS;
  if (cobra.some(s => s.x===nx && s.y===ny)){
    const t = performance.now();
    if (t - erroT > 700){ somOps(); erroT = t; }
    const temSaida = [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy]) => {
      const tx=(cobra[0].x+dx+COLS)%COLS, ty=(cobra[0].y+dy+ROWS)%ROWS;
      return !cobra.some(s=>s.x===tx && s.y===ty);
    });
    if (!temSaida) reorganizar();
    return;
  }
  cobra.unshift({x:nx, y:ny});
  const li = letras.findIndex(t => t.x===nx && t.y===ny);
  if (li >= 0){
    const t = letras[li];
    if (t.l === atual().l){
      comidas++; pintarEstrelas();
      crescerPendente += 1;
      letrasNaCobra.push({l:t.l, cor:t.cor, idx:letrasNaCobra.length + 1});
      somGlup(); confete(); balao('É o ' + t.l + '!'); falar(atual().fala + '!');
      letras.splice(li,1); alvoIdx++;
      if (alvoIdx >= grupo.letras.length){ completou(); return; }
      if (modo === 'facil') letras.push(celulaLivre(atual()));
      anunciarAlvo();
    } else { somOps(); erroT = performance.now(); }
  }
  if (crescerPendente > 0) crescerPendente--; else cobra.pop();
}
// ---- Festa final ----
function completou(){
  rodando = false;
  somFesta();
  confete(60);
  setTimeout(()=>confete(40), 700);
  balao(grupo.id==='meuNome' ? '🎉 ' + nomeSalvo() + '!' : '🎉 Parabéns!');
  clearTimeout(festaTimer);
  festaTimer = setTimeout(mostrarTelaFim, 2500);
}
function mostrarTelaFim(){
  if (grupo.id === 'vogais') prog.vogais = true;
  else if (grupo.id === 'meuNome') prog.nome = true;
  else if (grupo.id === 'alfabeto') prog.alfabeto = true;
  else prog.blocos[grupo.bloco-1] = true;
  salvarProg();
  $('#tituloFim').textContent = grupo.id==='vogais' ? '🎉 Você completou as vogais!' :
    (grupo.id==='meuNome' ? '🎉 Você comeu o seu nome inteiro!' :
    (grupo.id==='alfabeto' ? '🎉 Você comeu o alfabeto inteiro!' :
    '🎉 Bloco ' + grupo.bloco + ' concluído!'));
  $('#resumo').textContent = 'Você comeu ' + comidas + ' letrinha' + (comidas===1?'':'s') + '! 🏆';
  const so = $('#soletraFim');
  so.innerHTML = '';
  letrasNaCobra.forEach(c=>{
    const b = document.createElement('span');
    b.className = 'miniLetra grande';
    b.style.background = c.cor;
    b.textContent = c.l;
    so.appendChild(b);
  });
  so.style.display = letrasNaCobra.length ? 'flex' : 'none';
  const proximo = (grupo.id !== 'meuNome' && grupo.id !== 'alfabeto') ? GRUPOS[GRUPOS.indexOf(grupo)+1] : null;
  $('#btnProxima').style.display = proximo ? 'inline-block' : 'none';
  $('#telaFim').classList.remove('escondido');
  if (grupo.id === 'meuNome' && nomeSalvo()) falar('Parabéns, ' + nomeSalvo() + '!');
  else falar('Parabéns!');
}
function proximaFase(){
  clearTimeout(festaTimer);
  const p = GRUPOS[GRUPOS.indexOf(grupo)+1];
  if (p) iniciarGrupo(p, 'facil');
}
function iniciarGrupo(g, m){
  clearTimeout(festaTimer);
  garantirAudio();
  grupo = g; modo = m || 'facil';
  alvoIdx = 0; comidas = 0; crescerPendente = 0; letrasNaCobra = []; pintarEstrelas();
  $('#menuFases').classList.add('escondido');
  $('#menuBlocos').classList.add('escondido');
  $('#pedirNome').classList.add('escondido');
  $('#painelShare').classList.add('escondido');
  $('#telaFim').classList.add('escondido');
  novaCobra(); colocarLetras();
  rodando = true; ultimoTick = performance.now();
  anunciarAlvo();
}
function abrirFase(i){
  if (i === 5 && !alfabetoLiberado()){ balao('Complete os 4 blocos primeiro! 🔒'); return; }
  iniciarGrupo(GRUPOS[i], 'facil');
}
function abrirBlocos(){ $('#menuFases').classList.add('escondido'); renderMenus(); $('#menuBlocos').classList.remove('escondido'); }
function abrirBloco(n){ iniciarGrupo(GRUPOS[n], 'facil'); }
function jogarDeNovo(){ iniciarGrupo(grupo, 'facil'); }
function modoCaca(){ iniciarGrupo(grupo, 'caca'); }
function voltarMenu(){
  clearTimeout(festaTimer);
  rodando = false;
  $('#menuBlocos').classList.add('escondido');
  $('#pedirNome').classList.add('escondido');
  $('#painelShare').classList.add('escondido');
  $('#telaFim').classList.add('escondido');
  renderMenus();
  $('#menuFases').classList.remove('escondido');
}
// ---- Modo "Meu nome" ----
function abrirNome(){
  $('#menuFases').classList.add('escondido');
  $('#inputNome').value = nomeSalvo();
  $('#pedirNome').classList.remove('escondido');
}
function fecharNome(){ $('#pedirNome').classList.add('escondido'); voltarMenu(); }
function confirmarNome(){
  const bruto = $('#inputNome').value || '';
  const limpo = bruto.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z]/g,'');
  if (limpo.length < 2){ balao('Digite um nome com 2 letras ou mais!'); return; }
  salvarNome(limpo);
  grupoNome = {
    id:'meuNome', bloco:-1,
    letras: limpo.split('').map((l,i)=>({ l, cor: PALETA_NOME[i % PALETA_NOME.length], fala: l }))
  };
  $('#pedirNome').classList.add('escondido');
  iniciarGrupo(grupoNome, 'facil');
  falar('Vamos lá, ' + limpo + '!');
}
// ---- Compartilhar ----
let pausadoPorPainel = false;
function linkJogo(){ return location.href.split('?')[0]; }
function textoShare(){ return 'Brincadeira gratuita de letras para crianças de 4 a 5 anos 🐍 ' + linkJogo(); }
function retomarSePausado(){
  if (pausadoPorPainel){ rodando = true; ultimoTick = performance.now(); pausadoPorPainel = false; }
}
function abrirShare(){
  pausadoPorPainel = rodando;
  rodando = false;
  $('#painelShare').classList.remove('escondido');
}
function fecharShare(){
  $('#painelShare').classList.add('escondido');
  retomarSePausado();
}
function compartilharWhatsApp(){
  window.open('https://wa.me/?text=' + encodeURIComponent(textoShare()), '_blank');
}
function copiarLink(){
  $('#painelShare').classList.add('escondido');
  retomarSePausado();
  if (navigator.clipboard){
    navigator.clipboard.writeText(linkJogo())
      .then(()=>balao('Link copiado! 📋'))
      .catch(()=>balao('Copie o link da barra de endereço 📋'));
  } else balao('Copie o link da barra de endereço 📋');
}
function compartilharNativo(){
  if (navigator.share){
    navigator.share({ title:'Cobrinha do Alfabeto', text:'Brincadeira gratuita de letras para crianças de 4 a 5 anos 🐍', url: linkJogo() })
      .then(()=>fecharShare())
      .catch(()=>{});
  } else copiarLink();
}
// ---- Direções ----
function setDir(x,y){
  if (!rodando) return;
  if (dir.x === x && dir.y === y) return;
  dirPendente = {x,y};
}
function ligarBotao(id, x, y){
  const b = document.querySelector(id);
  const vai = e => { if(e.cancelable) e.preventDefault(); setDir(x,y); };
  b.addEventListener('touchstart', vai, {passive:false});
  b.addEventListener('pointerdown', vai);
  b.addEventListener('mousedown', vai);
}
ligarBotao('#sUp', 0,-1); ligarBotao('#sDown', 0,1);
ligarBotao('#sLeft', -1,0); ligarBotao('#sRight', 1,0);
window.addEventListener('keydown', e=>{
  if (e.key==='ArrowUp'||e.key==='w') setDir(0,-1);
  else if (e.key==='ArrowDown'||e.key==='s') setDir(0,1);
  else if (e.key==='ArrowLeft'||e.key==='a') setDir(-1,0);
  else if (e.key==='ArrowRight'||e.key==='d') setDir(1,0);
});
let toqueIni = null;
document.addEventListener('touchstart', e=>{ toqueIni = {x:e.touches[0].clientX, y:e.touches[0].clientY}; }, {passive:true});
document.addEventListener('touchmove', e=>{
  if (!toqueIni || !rodando) return;
  const dx = e.touches[0].clientX - toqueIni.x, dy = e.touches[0].clientY - toqueIni.y;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx>0?1:-1, 0); else setDir(0, dy>0?1:-1);
  toqueIni = {x:e.touches[0].clientX, y:e.touches[0].clientY};
}, {passive:true});
// ---- Desenho ----
function rrect(x,y,w,h,r){
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x,y,w,h,r);
  else {
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  }
  ctx.fill();
}
function desenhar(agora){
  const W = COLS*cel, H = ROWS*cel;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle = '#f0e6c8'; ctx.lineWidth = 1;
  for(let i=1;i<COLS;i++){ ctx.beginPath(); ctx.moveTo(i*cel,0); ctx.lineTo(i*cel,H); ctx.stroke(); }
  for(let j=1;j<ROWS;j++){ ctx.beginPath(); ctx.moveTo(0,j*cel); ctx.lineTo(W,j*cel); ctx.stroke(); }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = '700 ' + Math.round(cel*0.58) + 'px Fredoka, sans-serif';
  letras.forEach(t=>{
    const cx = t.x*cel + cel/2, cy = t.y*cel + cel/2;
    const r = cel*0.42*(1 + Math.sin(agora/300 + t.x)*0.05);
    if (t.l === atual().l && rodando){
      ctx.strokeStyle = '#f2b418'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx,cy,r+4,0,Math.PI*2); ctx.stroke();
    }
    ctx.fillStyle = t.cor;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.30)';
    ctx.strokeText(t.l, cx, cy + cel*0.02);
    ctx.fillStyle = '#fff';
    ctx.fillText(t.l, cx, cy + cel*0.02);
  });
  let off = 0;
  if (agora - erroT < 350) off = Math.sin((agora-erroT)/30)*3;
  cobra.forEach((s,i)=>{
    ctx.fillStyle = i===0 ? '#2c7a3f' : '#3fae5a';
    rrect(s.x*cel+1+off, s.y*cel+1, cel-2, cel-2, i===0?9:7);
    if (i===0){
      const mx = s.x*cel + cel/2 + off, my = s.y*cel + cel/2;
      const px = -dir.y, py = dir.x;
      [[1],[-1]].forEach(([lado])=>{
        const ex = mx + px*lado*3.5 + dir.x*2.5;
        const ey = my + py*lado*3.5 + dir.y*2.5;
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,ey,3.2,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(ex+dir.x,ey+dir.y,1.6,0,Math.PI*2); ctx.fill();
      });
    }
  });
  ctx.font = '700 ' + Math.round(cel*0.42) + 'px Fredoka, sans-serif';
  letrasNaCobra.forEach(c=>{
    if (c.idx < cobra.length){
      const s = cobra[c.idx];
      const lx = s.x*cel + cel/2 + off, ly = s.y*cel + cel/2;
      ctx.fillStyle = c.cor;
      ctx.beginPath(); ctx.arc(lx, ly, cel*0.36, 0, Math.PI*2); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.stroke();
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.30)';
      ctx.strokeText(c.l, lx, ly + cel*0.02);
      ctx.fillStyle = '#fff';
      ctx.fillText(c.l, lx, ly + cel*0.02);
    }
  });
}
// ---- Tamanho ----
function redimensionar(){
  const area = $('#areaJogo');
  const dpr = window.devicePixelRatio || 1;
  const w = area.clientWidth - 20, h = area.clientHeight - 20;
  cel = Math.max(16, Math.floor(Math.min(w/COLS, h/ROWS)));
  const W = COLS*cel, H = ROWS*cel;
  tela.style.width = W+'px'; tela.style.height = H+'px';
  tela.width = Math.round(W*dpr); tela.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', redimensionar);
// ---- Loop ----
let ultimoTick = 0;
function loop(agora){
  requestAnimationFrame(loop);
  if (document.hidden){ ultimoTick = agora; return; }
  if (rodando && agora - ultimoTick >= TICK){ ultimoTick = agora; passo(); }
  desenhar(agora);
}
redimensionar();
novaCobra();
renderMenus();
requestAnimationFrame(loop);
</script>
