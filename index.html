<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🐍 A Cobrinha das Vogais</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overflow:hidden;background:#fdf3d8;font-family:'Fredoka',sans-serif;max-width:100vw}
#app{height:100%;height:100dvh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;user-select:none}
header{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px}
#alvo{background:#fff;border:3px solid #f2b418;border-radius:18px;padding:4px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
#alvoTxt{font-size:16px;color:#6b5b2a;font-weight:600}
#alvoLetra{font-size:34px;font-weight:700;min-width:40px;text-align:center}
#btnVoz{font-size:26px;background:#fff;border:3px solid #f2b418;border-radius:14px;padding:6px 10px;cursor:pointer}
#estrelas{font-size:20px;letter-spacing:2px;min-height:26px;text-align:center;width:100%;max-width:480px}
#areaJogo{position:relative;flex:1;display:flex;align-items:center;justify-content:center;width:100%}
canvas{display:block;background:#fffdf3;border-radius:14px;border:4px solid #e7d9a8;box-shadow:0 4px 0 rgba(0,0,0,.06);margin:0 auto}
#balaoMsg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:#fff;border:4px solid #3fae5a;color:#2c7a3f;font-size:32px;font-weight:700;padding:10px 22px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
#balaoMsg.mostrar{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
#confete{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.pedacinho{position:absolute;width:10px;height:14px;top:-16px;border-radius:3px;animation:cai 1.4s linear forwards}
@keyframes cai{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
#dpad{width:100%;max-width:480px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:8px;padding:10px 16px 18px}
.seta{font-size:30px;padding:14px 0;background:#fff;border:3px solid #3fae5a;color:#2c7a3f;border-radius:16px;cursor:pointer;box-shadow:0 4px 0 #2c7a3f}
.seta:active{transform:translateY(3px);box-shadow:0 1px 0 #2c7a3f}
#sUp{grid-column:2;grid-row:1}#sLeft{grid-column:1;grid-row:2}#sDown{grid-column:2;grid-row:2}#sRight{grid-column:3;grid-row:2}
.overlay{position:fixed;inset:0;background:rgba(253,243,216,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;z-index:10}
.overlay.escondido{display:none}
.overlay h1{font-size:28px;color:#2c7a3f}
.overlay p{font-size:20px;color:#6b5b2a}
.overlay button{font-family:inherit;font-size:24px;font-weight:600;padding:14px 30px;border-radius:18px;border:none;cursor:pointer;background:#3fae5a;color:#fff;box-shadow:0 5px 0 #2c7a3f}
.overlay button:active{transform:translateY(3px);box-shadow:0 2px 0 #2c7a3f}
#btnCaca{background:#f2b418;color:#6b4b00;box-shadow:0 5px 0 #b98a0a}
#btnCaca.bloqueado{opacity:.5;pointer-events:none}
#medalha{font-size:80px;animation:pulsa 1s infinite alternate}
@keyframes pulsa{from{transform:scale(1)}to{transform:scale(1.15)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="alvo"><span id="alvoTxt">Procure:</span><span id="alvoLetra">A</span></div>
    <button id="btnVoz" title="Repetir">🔊</button>
  </header>
  <div id="estrelas"></div>
  <div id="areaJogo">
    <canvas id="tela"></canvas>
    <div id="balaoMsg"></div>
    <div id="confete"></div>
  </div>
  <div id="dpad">
    <button class="seta" id="sUp">▲</button>
    <button class="seta" id="sLeft">◀</button>
    <button class="seta" id="sDown">▼</button>
    <button class="seta" id="sRight">▶</button>
  </div>
</div>

<div id="telaInicio" class="overlay">
  <h1>🐍 A Cobrinha das Vogais</h1>
  <p>Coma as vogais na ordem certa:<br><b>A → E → I → O → U</b></p>
  <button id="btnJogar">▶ Jogar</button>
</div>

<div id="telaFim" class="overlay escondido">
  <div id="medalha">🏆</div>
  <h1>🎉 Você completou as vogais!</h1>
  <p id="resumo"></p>
  <button id="btnDeNovo">Jogar de novo</button>
  <button id="btnCaca" class="bloqueado">Modo caça 🔍</button>
</div>

<script>
/* =========================================================
   A COBRINHA DAS VOGAIS — alfabetização (4-5 anos)
   Cobra lenta, sem morte, come A→E→I→O→U na ordem certa.
   ========================================================= */
const COLS = 12, ROWS = 14;
const VOGAIS = ['A','E','I','O','U'];
const NOMES  = {A:'a', E:'é', I:'i', O:'ó', U:'u'};
const CORES  = {A:'#e74c3c', E:'#2f86eb', I:'#f0b429', O:'#e8752a', U:'#8e44ad'};
const TICK   = 420;

let cobra = [], dir = {x:1,y:0}, dirPendente = null;
let alvoIdx = 0, comidas = 0, rodando = false, modo = 'facil';
let letras = [];
let erroT = 0, cel = 30;

const $ = s => document.querySelector(s);
const tela = $('#tela'), ctx = tela.getContext('2d');

// ---- Voz em português ----
let vozPT = null;
function acharVoz(){
  const vs = speechSynthesis.getVoices();
  vozPT = vs.find(v => /pt[-_]BR/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window){ acharVoz(); speechSynthesis.onvoiceschanged = acharVoz; }
function falar(txt){
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = 'pt-BR'; u.rate = .95; u.pitch = 1.1;
  if (vozPT) u.voice = vozPT;
  speechSynthesis.speak(u);
}
function falarLetra(L){ falar(NOMES[L] + '!'); }
function anunciarAlvo(){
  const L = VOGAIS[alvoIdx];
  $('#alvoLetra').textContent = L;
  $('#alvoLetra').style.color = CORES[L];
  falar('A cobrinha quer a letra ' + NOMES[L] + '!');
}

// ---- Sons ----
let audio = null;
function nota(freq, ini, dur, tipo, vol){
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = tipo || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || .2, audio.currentTime + ini);
  g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + ini + dur);
  o.connect(g); g.connect(audio.destination);
  o.start(audio.currentTime + ini); o.stop(audio.currentTime + ini + dur);
}
function somGlup(){ if(audio){ nota(523,0,.09,'triangle',.25); nota(784,.09,.14,'triangle',.25); } }
function somOps(){ if(audio) nota(196,0,.18,'sine',.18); }
function somFesta(){ if(audio) [523,659,784,1047].forEach((f,i)=>nota(f,i*.14,.22,'triangle',.22)); }

// ---- Confete e balão ----
function confete(qtd){
  const cores = ['#e74c3c','#2f86eb','#f0b429','#e8752a','#8e44ad','#3fae5a'];
  for (let i=0;i<(qtd||24);i++){
    const p = document.createElement('div');
    p.className = 'pedacinho';
    p.style.left = Math.random()*100 + '%';
    p.style.background = cores[i%cores.length];
    p.style.animationDuration = (1 + Math.random()*.8) + 's';
    p.style.animationDelay = (Math.random()*.3) + 's';
    $('#confete').appendChild(p);
    setTimeout(()=>p.remove(), 2500);
  }
}
let balaoTimer = null;
function balao(txt){
  const b = $('#balaoMsg');
  b.textContent = txt; b.classList.add('mostrar');
  clearTimeout(balaoTimer);
  balaoTimer = setTimeout(()=>b.classList.remove('mostrar'), 1200);
}
function pintarEstrelas(){
  const n = Math.min(comidas, 10);
  $('#estrelas').textContent = '⭐'.repeat(n) + (comidas>10 ? ' x'+comidas : '');
}

// ---- Tabuleiro ----
function celulaLivre(letra){
  while (true){
    const x = Math.floor(Math.random()*COLS), y = Math.floor(Math.random()*ROWS);
    const naCobra = cobra.some(s => s.x===x && s.y===y);
    const naLetra = letras.some(l => l.x===x && l.y===y);
    const perto = Math.abs(cobra[0].x-x) + Math.abs(cobra[0].y-y) < 3;
    if (!naCobra && !naLetra && !perto) return {x, y, letra};
  }
}
function colocarLetras(){
  letras = [];
  if (modo === 'facil') letras.push(celulaLivre(VOGAIS[alvoIdx]));
  else VOGAIS.forEach(v => letras.push(celulaLivre(v)));
}

// ---- Cobra ----
function novaCobra(){
  for (let y=2; y<ROWS-2; y++){
    for (let x=1; x<COLS-4; x++){
      const livre = [0,1,2].every(i => !letras.some(l=>l.x===x+i && l.y===y));
      if (livre){ cobra=[{x:x+2,y},{x:x+1,y},{x,y}]; dir={x:1,y:0}; dirPendente=null; return; }
    }
  }
  cobra=[{x:5,y:7},{x:4,y:7},{x:3,y:7}]; dir={x:1,y:0}; dirPendente=null;
}
function encolher(){
  somOps(); erroT = performance.now();
  novaCobra();
}

// ---- Passo da cobra ----
function passo(){
  if (dirPendente){
    const reverso = dirPendente.x === -dir.x && dirPendente.y === -dir.y;
    if (!reverso) dir = dirPendente;
    dirPendente = null;
  }
  const nx = (cobra[0].x + dir.x + COLS) % COLS;
  const ny = (cobra[0].y + dir.y + ROWS) % ROWS;
  if (cobra.some(s => s.x===nx && s.y===ny)){ encolher(); return; }
  cobra.unshift({x:nx, y:ny});
  let cresceu = false;
  const li = letras.findIndex(l => l.x===nx && l.y===ny);
  if (li >= 0){
    const l = letras[li];
    if (l.letra === VOGAIS[alvoIdx]){
      cresceu = true; comidas++; pintarEstrelas();
      somGlup(); confete(); balao('É o ' + l.letra + '!'); falarLetra(l.letra);
      letras.splice(li,1); alvoIdx++;
      if (alvoIdx >= VOGAIS.length){ completou(); return; }
      if (modo === 'facil') letras.push(celulaLivre(VOGAIS[alvoIdx]));
      anunciarAlvo();
    } else {
      somOps(); erroT = performance.now();
    }
  }
  if (!cresceu) cobra.pop();
}

// ---- Fim ----
function completou(){
  rodando = false;
  somFesta(); confete(60);
  $('#btnCaca').classList.remove('bloqueado');
  $('#resumo').textContent = 'Você comeu ' + comidas + ' letra' + (comidas===1?'':'s') + '! 🏆';
  $('#telaFim').classList.remove('escondido');
  falar('Parabéns! Você completou as vogais!');
}
function reiniciar(novoModo){
  modo = novoModo || 'facil';
  alvoIdx = 0; comidas = 0; pintarEstrelas();
  novaCobra(); colocarLetras();
  $('#telaFim').classList.add('escondido');
  rodando = true; ultimoTick = performance.now();
  anunciarAlvo();
}

// ---- Botões ----
$('#btnJogar').addEventListener('click', ()=>{
  if (!audio){ try{ audio = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  $('#telaInicio').classList.add('escondido');
  alvoIdx = 0; comidas = 0; pintarEstrelas();
  novaCobra(); colocarLetras();
  rodando = true; ultimoTick = performance.now();
  anunciarAlvo();
});
$('#btnDeNovo').addEventListener('click', ()=>reiniciar('facil'));
$('#btnCaca').addEventListener('click', ()=>reiniciar('caca'));
$('#btnVoz').addEventListener('click', ()=>falar('A cobrinha quer a letra ' + NOMES[VOGAIS[alvoIdx]] + '!'));

// ---- Direções: botões, swipe e teclado (toque universal) ----
function setDir(x,y){
  if (!rodando) return;
  if (dir.x === x && dir.y === y) return;
  dirPendente = {x,y};
}
function ligarBotao(id, x, y){
  const b = document.querySelector(id);
  const vai = e => { if(e.cancelable) e.preventDefault(); setDir(x,y); };
  b.addEventListener('touchstart', vai, {passive:false});
  b.addEventListener('pointerdown', vai);
  b.addEventListener('mousedown', vai);
  b.addEventListener('click', vai);
}
ligarBotao('#sUp', 0,-1); ligarBotao('#sDown', 0,1);
ligarBotao('#sLeft', -1,0); ligarBotao('#sRight', 1,0);
window.addEventListener('keydown', e=>{
  if (e.key==='ArrowUp'||e.key==='w') setDir(0,-1);
  else if (e.key==='ArrowDown'||e.key==='s') setDir(0,1);
  else if (e.key==='ArrowLeft'||e.key==='a') setDir(-1,0);
  else if (e.key==='ArrowRight'||e.key==='d') setDir(1,0);
});
let toqueIni = null;
document.addEventListener('touchstart', e=>{ toqueIni = {x:e.touches[0].clientX, y:e.touches[0].clientY}; }, {passive:true});
document.addEventListener('touchmove', e=>{
  if (!toqueIni || !rodando) return;
  const dx = e.touches[0].clientX - toqueIni.x, dy = e.touches[0].clientY - toqueIni.y;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx>0?1:-1, 0); else setDir(0, dy>0?1:-1);
  toqueIni = {x:e.touches[0].clientX, y:e.touches[0].clientY};
}, {passive:true});

// ---- Desenho ----
function rrect(x,y,w,h,r){
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x,y,w,h,r);
  else {
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  }
  ctx.fill();
}
function desenhar(agora){
  const W = COLS*cel, H = ROWS*cel;
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle = '#f0e6c8'; ctx.lineWidth = 1;
  for(let i=1;i<COLS;i++){ ctx.beginPath(); ctx.moveTo(i*cel,0); ctx.lineTo(i*cel,H); ctx.stroke(); }
  for(let j=1;j<ROWS;j++){ ctx.beginPath(); ctx.moveTo(0,j*cel); ctx.lineTo(W,j*cel); ctx.stroke(); }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  letras.forEach(l=>{
    const cx = l.x*cel + cel/2, cy = l.y*cel + cel/2;
    const r = cel*0.40*(1 + Math.sin(agora/300 + l.x)*0.06);
    ctx.fillStyle = CORES[l.letra];
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '700 ' + Math.round(cel*0.46) + 'px Fredoka, sans-serif';
    ctx.fillText(l.letra, cx, cy + cel*0.02);
  });
  let off = 0;
  if (agora - erroT < 350) off = Math.sin((agora-erroT)/30)*3;
  cobra.forEach((s,i)=>{
    ctx.fillStyle = i===0 ? '#2c7a3f' : '#3fae5a';
    rrect(s.x*cel+1+off, s.y*cel+1, cel-2, cel-2, i===0?9:7);
    if (i===0){
      const mx = s.x*cel + cel/2 + off, my = s.y*cel + cel/2;
      const px = -dir.y, py = dir.x;
      [[1],[-1]].forEach(([lado])=>{
        const ex = mx + px*lado*3.5 + dir.x*2.5;
        const ey = my + py*lado*3.5 + dir.y*2.5;
        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,ey,3.2,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(ex+dir.x,ey+dir.y,1.6,0,Math.PI*2); ctx.fill();
      });
    }
  });
}

// ---- Tamanho ----
function redimensionar(){
  const area = $('#areaJogo');
  const dpr = window.devicePixelRatio || 1;
  const w = area.clientWidth - 24, h = area.clientHeight - 24;
  cel = Math.max(14, Math.floor(Math.min(w/COLS, h/ROWS)));
  const W = COLS*cel, H = ROWS*cel;
  tela.style.width = W+'px'; tela.style.height = H+'px';
  tela.width = Math.round(W*dpr); tela.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', redimensionar);

// ---- Loop ----
let ultimoTick = 0;
function loop(agora){
  requestAnimationFrame(loop);
  if (document.hidden){ ultimoTick = agora; return; }
  if (rodando && agora - ultimoTick >= TICK){ ultimoTick = agora; passo(); }
  desenhar(agora);
}
redimensionar();
novaCobra(); colocarLetras();
$('#alvoLetra').textContent = 'A'; $('#alvoLetra').style.color = CORES.A;
requestAnimationFrame(loop);
</script>
</body>
</html>
